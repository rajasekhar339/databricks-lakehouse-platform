[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lakehouse"
version = "0.1.0"
description = "Medallion pipelines for the lakehouse"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
  "pyspark==3.5.3",
  "pytest>=8.0",
  "ruff>=0.6",
  "build>=1.2",
]

[project.scripts]
bronze_ingest_orders = "lakehouse.bronze.ingest_orders:main"
bronze_ingest_customers = "lakehouse.bronze.ingest_customers:main"
silver_orders = "lakehouse.silver.orders:main"
gold_daily_sales = "lakehouse.gold.daily_sales:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"


[tool.ruff.lint]
select = ["E", "F", "I"]
