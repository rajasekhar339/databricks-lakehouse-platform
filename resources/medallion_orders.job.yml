resources:
  jobs:
    medallion_orders:
      name: medallion-orders
      description: Bronze ingest -> silver clean/merge -> gold aggregate -> quality checks.
      tags:
        domain: sales
        layer: medallion
      max_concurrent_runs: 1
      schedule:
        quartz_cron_expression: "0 0 2 * * ?"
        timezone_id: UTC
        pause_status: ${var.schedule_pause_status}
      email_notifications:
        on_failure:
          - ${var.notification_email}
      parameters:
        - name: catalog
          default: ${var.catalog}

      job_clusters:
        - job_cluster_key: etl
          new_cluster:
            policy_id: ${var.job_policy_id}
            apply_policy_default_values: true
            spark_version: 15.4.x-scala2.12
            node_type_id: ${var.node_type_id}
            data_security_mode: SINGLE_USER
            autoscale:
              min_workers: 1
              max_workers: ${var.max_workers}

      tasks:
        - task_key: bronze_orders
          job_cluster_key: etl
          python_wheel_task:
            package_name: lakehouse
            entry_point: bronze_ingest_orders
            parameters: ["--catalog", "{{job.parameters.catalog}}"]
          libraries:
            - whl: ../dist/*.whl

        - task_key: bronze_customers
          job_cluster_key: etl
          python_wheel_task:
            package_name: lakehouse
            entry_point: bronze_ingest_customers
            parameters: ["--catalog", "{{job.parameters.catalog}}"]
          libraries:
            - whl: ../dist/*.whl

        - task_key: silver_orders
          depends_on:
            - task_key: bronze_orders
          job_cluster_key: etl
          python_wheel_task:
            package_name: lakehouse
            entry_point: silver_orders
            parameters: ["--catalog", "{{job.parameters.catalog}}"]
          libraries:
            - whl: ../dist/*.whl

        - task_key: gold_daily_sales
          depends_on:
            - task_key: silver_orders
            - task_key: bronze_customers
          job_cluster_key: etl
          python_wheel_task:
            package_name: lakehouse
            entry_point: gold_daily_sales
            parameters: ["--catalog", "{{job.parameters.catalog}}"]
          libraries:
            - whl: ../dist/*.whl

        - task_key: gold_quality_checks
          depends_on:
            - task_key: gold_daily_sales
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/sql/gold_quality_checks.sql
            parameters:
              catalog: "{{job.parameters.catalog}}"
